name: fukhara

services:
  web:
    build: ./fukhara-web
    environment:
      NUXT_PUBLIC_USE_MOCK: "false"
      NUXT_API_PARTY_ENDPOINTS_FUKHARA_URL: http://api:8000
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - fukhara

  api:
    build:
      context: ./awesome-analysis-engine
      additional_contexts:
        zippatch: ./awesome-analysis-engine/zip_patch
    environment:
      MONGO_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/
      MOBSF_URL: http://mobsf:8000
      MOBSF_API_KEY: ${MOBSF_API_KEY:?Set MOBSF_API_KEY in .env}
      APK_DIR: /data/apk_files
      APK_VOLUME: fukhara_apk_files
      VIRUSTOTAL_API_KEY: ${VIRUSTOTAL_API_KEY:-}
      MALWAREBAZAAR_API_KEY: ${MALWAREBAZAAR_API_KEY:-}
    volumes:
      - apk_files:/data/apk_files
      # The API starts the analysis tools as sibling containers
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      # Swagger UI at http://localhost:8000/docs (development only)
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/openapi.json')"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      mongo:
        condition: service_healthy
      mobsf:
        condition: service_healthy
      apkid:
        condition: service_completed_successfully
      quark-engine:
        condition: service_completed_successfully
      androcfg:
        condition: service_completed_successfully
      ssdeep:
        condition: service_completed_successfully
      apk-info:
        condition: service_completed_successfully
      yara-analyzer:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - fukhara

  mongo:
    # Mongo 8.x and 9.x refuse to start on Linux kernels >= 6.19 (SERVER-121912)
    image: mongo:7.0.43
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:?Set MONGO_USER in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?Set MONGO_PASSWORD in .env}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - fukhara

  mobsf:
    build:
      context: ./awesome-analysis-engine/tool_images/mobsf
      additional_contexts:
        zippatch: ./awesome-analysis-engine/zip_patch
    image: fukhara/mobsf
    environment:
      MOBSF_API_ONLY: "0"
      MOBSF_API_KEY: ${MOBSF_API_KEY:?Set MOBSF_API_KEY in .env}
    ports:
      # MobSF web UI at http://localhost:8181 (development only)
      - "${MOBSF_PORT:-8181}:8000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/login/')"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    restart: unless-stopped
    networks:
      - fukhara

  # Analysis tool images. The API runs them on demand through the Docker
  # socket; these services only build the images and exit.
  apkid:
    build:
      context: ./awesome-analysis-engine/tool_images/apkid
      additional_contexts:
        zippatch: ./awesome-analysis-engine/zip_patch
    image: fukhara/apkid
    entrypoint: ["true"]
    restart: "no"
    network_mode: none

  quark-engine:
    build:
      context: ./awesome-analysis-engine/tool_images/quark_engine
      additional_contexts:
        zippatch: ./awesome-analysis-engine/zip_patch
    image: fukhara/quark-engine
    entrypoint: ["true"]
    restart: "no"
    network_mode: none

  androcfg:
    build: ./awesome-analysis-engine/tool_images/androcfg
    image: fukhara/androcfg
    entrypoint: ["true"]
    restart: "no"
    network_mode: none

  ssdeep:
    build: ./awesome-analysis-engine/tool_images/ssdeep
    image: fukhara/ssdeep
    entrypoint: ["true"]
    restart: "no"
    network_mode: none

  apk-info:
    build:
      context: ./awesome-analysis-engine/apk_info
      additional_contexts:
        zippatch: ./awesome-analysis-engine/zip_patch
    image: fukhara/apk_info
    entrypoint: ["true"]
    restart: "no"
    network_mode: none

  yara-analyzer:
    build:
      context: ./awesome-analysis-engine/yara_analyzer
      additional_contexts:
        zippatch: ./awesome-analysis-engine/zip_patch
    image: fukhara/yara_analyzer
    entrypoint: ["true"]
    restart: "no"
    network_mode: none

  mongo-express:
    image: mongo-express:1.0.2-20-alpine3.19
    profiles: [debug]
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_USER}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_PASSWORD}
    ports:
      - "${MONGO_EXPRESS_PORT:-8081}:8081"
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - fukhara

volumes:
  mongo_data:
  apk_files:
    # Fixed name: the API mounts it by name into the tool containers
    name: fukhara_apk_files

networks:
  fukhara:
